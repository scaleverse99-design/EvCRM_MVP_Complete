name: Deploy Auto Browser to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'auto-browser/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY_NAME: evcrmregistry
  CONTAINER_APP_NAME: evcrm-auto-browser
  RESOURCE_GROUP: evcrm-resources
  IMAGE_NAME: evcrmregistry.azurecr.io/auto-browser:${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./auto-browser
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp up \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment evcrm-env \
            --image ${{ env.IMAGE_NAME }} \
            --target-port 8080 \
            --ingress external \
            --registry-server ${{ secrets.REGISTRY_LOGIN_SERVER }} \
            --registry-username ${{ secrets.REGISTRY_USERNAME }} \
            --registry-password ${{ secrets.REGISTRY_PASSWORD }} \
            --env-vars NODE_ENV=production
