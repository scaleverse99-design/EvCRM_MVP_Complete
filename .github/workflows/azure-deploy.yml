name: Deploy Auto Browser to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'auto-browser/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY_NAME: evcrmregistry
  CONTAINER_APP_NAME: evcrm-auto-browser
  RESOURCE_GROUP: evcrm-resources
  IMAGE_NAME: evcrmregistry.azurecr.io/auto-browser:${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin "${{ secrets.REGISTRY_LOGIN_SERVER }}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./auto-browser
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check Container App Status
        run: |
          STATUS=$(az containerapp show -n "${{ env.CONTAINER_APP_NAME }}" -g "${{ env.RESOURCE_GROUP }}" --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")
          echo "Container App Status: $STATUS"
          if [ "$STATUS" = "Failed" ]; then
            echo "Container app is in Failed state. Attempting repair..."
            az containerapp delete -n "${{ env.CONTAINER_APP_NAME }}" -g "${{ env.RESOURCE_GROUP }}" --yes
          fi

      - name: Deploy to Azure Container Apps
        run: |
          az extension add --name containerapp || true
          az containerapp up \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --environment evcrm-env \
            --image "${{ env.IMAGE_NAME }}" \
            --target-port 8080 \
            --ingress external \
            --registry-server "${{ secrets.REGISTRY_LOGIN_SERVER }}" \
            --registry-username "${{ secrets.REGISTRY_USERNAME }}" \
            --registry-password "${{ secrets.REGISTRY_PASSWORD }}"
